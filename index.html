<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ligue pickleball du jeudi</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1d4f91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pickleball">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Orbitron:wght@700&family=Teko:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: tableau de marque de club sportif, net et rapide sur un téléphone au bord du terrain
IDEA: la feuille de pointage affichée au mur du gymnase, un bloc par terrain
PICTURE: les cartes de terrain elles-mêmes, bleu court, lignes blanches, balle jaune optique
COLOUR and TYPE: bleu court #1d4f91 dominant, blanc, jaune balle #d6ee3a en accent, corail pour descendre; Barlow Condensed + Barlow
LAYOUT: bande bleue avec titre et onglets, puis une colonne de terrains; deux colonnes au-dessus de 900px
*/
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0c1522);--ink:light-dark(#0f1b2b,#e8eef6);--mute:light-dark(#5a6878,#9fb0c4);--line:light-dark(#dfe6ee,#22344b);--card:light-dark(#f4f7fb,#132235);--court:#1d4f91;--court2:#163e74;--ball:#d6ee3a;--down:#e4572e;--up:#2f9e5b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.num{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;line-height:1.05}
header{background:var(--court);color:#fff;padding:20px max(5vw,16px) 0}
header h1{margin:0;font-size:clamp(30px,6vw,44px);text-wrap:balance}
header p{margin:4px 0 14px;color:#c9d8ee}
nav{display:flex;gap:4px;overflow-x:auto}
nav a{flex:none;color:#dfe9f7;text-decoration:none;padding:10px 16px;border-radius:10px 10px 0 0;font-weight:600;min-height:44px}
nav a.on{background:var(--bg);color:var(--ink)}
main{padding:20px max(5vw,16px) 60px;max-width:1240px;margin:0 auto}
.note{color:var(--mute);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.pill.live{background:var(--ball);color:#1b2a05;border-color:transparent}
button,select,input{font:inherit;font-size:16px}
button{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer}
button.go{background:var(--court);color:#fff;border-color:var(--court)}
button.warn{color:var(--down)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,nav a:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
input,select{min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.courts{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.courts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.court{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.court>h3{margin:0;background:var(--court2);color:#fff;padding:10px 14px;font-size:24px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #fff}
.court>h3 span{font-size:15px;font-family:Barlow;font-weight:500;color:#c9d8ee}
.ppl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:10px}
.chip{display:flex;justify-content:space-between;gap:6px;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-weight:600;cursor:default}
.chip small{color:var(--mute);font-weight:500;white-space:nowrap}
.chip.sel{outline:3px solid var(--ball)}
.chip.up{border-left:5px solid var(--up)}.chip.down{border-left:5px solid var(--down)}
.swap .chip{cursor:pointer}
.match{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.teams{font-size:15px}.teams b{font-weight:600}.vs{color:var(--mute);padding:0 4px}
.sc{display:flex;gap:6px;align-items:center}
.sc input{width:58px;text-align:center}
.done{font-family:"Barlow Condensed";font-size:26px;white-space:nowrap}
.done .w{color:var(--up)}
.stand{padding:8px 14px 12px;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:14px;color:var(--mute);font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}
.big{font-family:"Barlow Condensed";font-size:22px}
.plus{color:var(--up)}.minus{color:var(--down)}
.panel.banner{border:2px solid var(--ball)}
.panel{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;background:var(--card)}
.panel h2{margin:0 0 10px;font-size:26px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
textarea{width:100%;min-height:140px;font:16px/1.4 Barlow,sans-serif;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.list li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.list{list-style:none;margin:0;padding:0}
.hero{font-family:"Barlow Condensed";font-size:clamp(40px,10vw,64px);color:var(--court)}
:root[data-theme=dark] .hero{color:var(--ball)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .hero{color:var(--ball)}}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgb(0 0 0/.45)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
.mine{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--ball);color:#1b2a05;border-radius:16px;padding:14px 18px;margin:0 0 16px;font-family:"Barlow Condensed";font-size:clamp(26px,6vw,36px);font-weight:700}
.mine .num{font-size:1.3em}.mine small{font-family:Barlow;font-size:15px;font-weight:600}
.court.me{outline:4px solid var(--ball);outline-offset:-1px}
tr.meRow td{background:color-mix(in srgb,var(--ball) 25%,transparent)}
#logout{float:right;background:transparent;color:#dfe9f7;border-color:#4d77b3;min-height:36px;padding:4px 12px;font-size:14px}
.mt{padding:12px 14px;border-top:1px solid var(--line)}
.mt .lab{font-size:14px;color:var(--mute);font-weight:600;margin-bottom:8px}
.tm{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--bg);border:2px solid var(--line)}
.tm .nm span{display:block;font-weight:600;line-height:1.35}
.tm .pts{font-family:"Barlow Condensed";font-size:34px;font-weight:700;text-align:center}
.tm input{width:72px;text-align:center;font-size:22px;font-weight:600}
.tm.win{border-color:var(--up)}.tm.win .pts{color:var(--up)}
.tm.lose .nm,.tm.lose .pts{color:var(--mute)}
.vs2{text-align:center;color:var(--mute);font-size:13px;margin:4px 0}
.mt .act{display:flex;justify-content:flex-end;margin-top:10px}

/* ====== Décors ====== */
header{position:relative;background-repeat:no-repeat}
footer.deco{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:18px 16px 40px;color:var(--mute);font-size:14px}
footer.deco button{min-height:40px;padding:6px 14px}
footer.deco button.on{background:var(--ball);color:#1b2a05;border-color:transparent}
/* Terrain de pickleball */
body[data-deco=terrain]{--bg:#ffffff;--ink:#0f1b2b;--card:rgb(255 255 255 /.14);--line:rgb(255 255 255 /.28);--mute:#d4ecd9;color:#fff;background:#2f7a47 repeating-linear-gradient(90deg,transparent 0 38px,rgb(0 0 0 /.05) 38px 40px)}
body[data-deco=terrain] header{background-color:#1a4f8f;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20260%20150%27%3E%3Cg%20transform%3D%27rotate%28-8%20130%2075%29%27%3E%3Crect%20x%3D%2720%27%20y%3D%2714%27%20width%3D%27220%27%20height%3D%27122%27%20fill%3D%27%232a6fc1%27%20stroke%3D%27%23fff%27%20stroke-width%3D%274%27/%3E%3Crect%20x%3D%27102%27%20y%3D%2714%27%20width%3D%2756%27%20height%3D%27122%27%20fill%3D%27%233f9a5a%27/%3E%3Crect%20x%3D%27127%27%20y%3D%2710%27%20width%3D%276%27%20height%3D%27130%27%20fill%3D%27%23111%27/%3E%3Cpath%20d%3D%27M102%2014v122M158%2014v122M20%2075h82M158%2075h82%27%20stroke%3D%27%23fff%27%20stroke-width%3D%273%27/%3E%3C/g%3E%3Cg%20transform%3D%27translate%28150%2040%29%20rotate%2828%29%27%3E%3Crect%20x%3D%270%27%20y%3D%270%27%20width%3D%2744%27%20height%3D%2754%27%20rx%3D%2720%27%20fill%3D%27%23e63946%27%20stroke%3D%27%23a3222d%27%20stroke-width%3D%274%27/%3E%3Crect%20x%3D%2715%27%20y%3D%2752%27%20width%3D%2714%27%20height%3D%2730%27%20rx%3D%274%27%20fill%3D%27%231d1d1d%27/%3E%3C/g%3E%3Cg%20transform%3D%27translate%2860%2034%29%20rotate%28-24%29%27%3E%3Crect%20x%3D%270%27%20y%3D%270%27%20width%3D%2744%27%20height%3D%2754%27%20rx%3D%2720%27%20fill%3D%27%23ffb703%27%20stroke%3D%27%23c98a00%27%20stroke-width%3D%274%27/%3E%3Crect%20x%3D%2715%27%20y%3D%2752%27%20width%3D%2714%27%20height%3D%2730%27%20rx%3D%274%27%20fill%3D%27%231d1d1d%27/%3E%3C/g%3E%3Cg%20transform%3D%27translate%28118%2092%29%27%3E%3Ccircle%20r%3D%2716%27%20fill%3D%27%23e3f23a%27%20stroke%3D%27%23b9c81c%27%20stroke-width%3D%272%27/%3E%3Cg%20fill%3D%27%239fb51f%27%3E%3Ccircle%20r%3D%272.4%27/%3E%3Ccircle%20cx%3D%27-7%27%20cy%3D%27-5%27%20r%3D%272.4%27/%3E%3Ccircle%20cx%3D%277%27%20cy%3D%27-5%27%20r%3D%272.4%27/%3E%3Ccircle%20cx%3D%27-7%27%20cy%3D%276%27%20r%3D%272.4%27/%3E%3Ccircle%20cx%3D%277%27%20cy%3D%276%27%20r%3D%272.4%27/%3E%3Ccircle%20cy%3D%27-12%27%20r%3D%272%27/%3E%3Ccircle%20cy%3D%2712%27%20r%3D%272%27/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"),linear-gradient(#1a4f8f,#14427a);background-repeat:no-repeat;background-size:230px auto,100% 100%;background-position:right -6px bottom 46px,0 0;border-bottom:6px solid #fff}
body[data-deco=terrain] header h1{text-shadow:0 2px 0 rgb(0 0 0 /.25);max-width:62%}

body[data-deco=terrain] .court>h3{background:#0f2f5c url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2040%2040%27%3E%3Ccircle%20cx%3D%2720%27%20cy%3D%2720%27%20r%3D%2718%27%20fill%3D%27%23e3f23a%27%20stroke%3D%27%23b9c81c%27%20stroke-width%3D%272%27/%3E%3Cg%20fill%3D%27%239fb51f%27%3E%3Ccircle%20cx%3D%2720%27%20cy%3D%2720%27%20r%3D%272.6%27/%3E%3Ccircle%20cx%3D%2712%27%20cy%3D%2714%27%20r%3D%272.6%27/%3E%3Ccircle%20cx%3D%2728%27%20cy%3D%2714%27%20r%3D%272.6%27/%3E%3Ccircle%20cx%3D%2712%27%20cy%3D%2726%27%20r%3D%272.6%27/%3E%3Ccircle%20cx%3D%2728%27%20cy%3D%2726%27%20r%3D%272.6%27/%3E%3Ccircle%20cx%3D%2720%27%20cy%3D%278%27%20r%3D%272.3%27/%3E%3Ccircle%20cx%3D%2720%27%20cy%3D%2732%27%20r%3D%272.3%27/%3E%3Ccircle%20cx%3D%277%27%20cy%3D%2720%27%20r%3D%272.2%27/%3E%3Ccircle%20cx%3D%2733%27%20cy%3D%2720%27%20r%3D%272.2%27/%3E%3C/g%3E%3C/svg%3E") no-repeat left 12px center/30px;padding-left:52px;border-bottom:4px solid #fff;font-size:28px}

body[data-deco=terrain] .mt .lab{color:#fff;text-shadow:0 1px 0 rgb(0 0 0 /.3)}
body[data-deco=terrain] .tm{border:0;padding-left:52px;background-repeat:no-repeat;background-position:10px center;background-size:30px auto;box-shadow:0 3px 0 rgb(0 0 0 /.2)}

// ---------- Cote Elo ----------
// Cote Elo calibrée pour la montée-descente :
// mise à jour en lot (cotes du début de soirée, ordre des matchs sans effet),
// K de 48 pendant les 12 premiers matchs d'un joueur puis 16, K du match = moyenne des 4 joueurs (somme nulle, partenaires égaux).
const K_NEW=48, K_EST=16, N_PROV=12;
// Fiabilité de la cote : 100 % pour les joueurs établis; pour un nouveau joueur, elle monte avec chaque match jusqu'à 12 matchs.
const fiTag=t=>t&&t.fi<1?` <span class="tier" style="--tc:#8fa3bd" title="La cote d'un nouveau joueur bouge plus vite jusqu'à 12 matchs">Fiabilité ${Math.round(t.fi*100)} %</span>`:'';
// Les joueurs déjà inscrits avant la première soirée (classement repris de la saison en cours) sont établis dès le départ :
// seuls les joueurs ajoutés après la première soirée ont le K provisoire.
function isNew(p){const first=Object.keys(S.nights).sort()[0];if(!first||!p.created)return false;const d=new Date(p.created),loc=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return loc>first}
function compute(){
  const R={},st={},mi={},cnt={};
  for(const [id,p] of Object.entries(S.players)){R[id]=Number(p.seed)||1500;cnt[id]=isNew(p)?0:N_PROV;st[id]={w:0,l:0,pf:0,pa:0,nights:new Set(),last:0,lastNight:null,pre:{},byNight:{}}}
  const list=Object.values(S.scores).filter(s=>S.nights[s.night]&&valid(s.sa,s.sb)).sort((a,b)=>a.night.localeCompare(b.night)||a.round-b.round||a.court-b.court||a.m-b.m);
  const byN={};for(const s of list)(byN[s.night]=byN[s.night]||[]).push(s);
  for(const nid of Object.keys(byN).sort()){
    const pre={...R},c0={...cnt},delta={};
    for(const s of byN[nid]){
      const A=s.a.filter(x=>R[x]!=null),B=s.b.filter(x=>R[x]!=null); if(!A.length||!B.length)continue;
      const ra=A.reduce((t,x)=>t+pre[x],0)/A.length, rb=B.reduce((t,x)=>t+pre[x],0)/B.length;
      const ea=1/(1+10**((rb-ra)/400)), sa=s.sa>s.sb?1:0, mg=Math.abs(s.sa-s.sb); mi[s.id]={ra,rb,ea};
      const k=mean([...A,...B].map(x=>c0[x]<N_PROV?K_NEW:K_EST)), M=0.6+0.4*Math.log(mg+1)/Math.log(11), d=k*M*(sa-ea), dn=K_EST*M*(sa-ea);
      const apply=(ids,dd,pf,pa,win,pn)=>ids.forEach(x=>{delta[x]=(delta[x]||0)+dd;cnt[x]++;const t=st[x];t.perf=t.perf||{};t.perf[nid]=(t.perf[nid]||0)+pn;if(!(nid in t.pre))t.pre[nid]=pre[x];t.pf+=pf;t.pa+=pa;win?t.w++:t.l++;t.nights.add(nid);if(t.lastNight!==nid){t.lastNight=nid;t.last=0}t.last+=dd;t.byNight[nid]=(t.byNight[nid]||0)+dd});
      apply(A,d,s.sa,s.sb,sa===1,dn);apply(B,-d,s.sb,s.sa,sa===0,-dn);
    }
    for(const x in delta)R[x]+=delta[x];
  }
  for(const id in R){R[id]+=Number(S.players[id].adj)||0;st[id].fi=Math.min(1,cnt[id]/N_PROV);st[id].nm=Math.min(cnt[id],N_PROV)}
  return {R,st,mi};
}
const valid=(a,b)=>Number.isInteger(a)&&Number.isInteger(b)&&Math.max(a,b)===21&&Math.min(a,b)>=0&&Math.min(a,b)<21;

// ---------- Trophées de la soirée ----------
const TROPH=[
  {k:'ja',name:'Le Jack Adams',what:'A fait briller ses partenaires',col:'#2f7bff'},
  {k:'lb',name:'Le Lady Byng',what:'A fait briller ses adversaires',col:'#9fb3c8'},
  {k:'mr',name:'Le Maurice-Richard',what:'Performance de la soirée',col:'#ffc531'}];
const mean=a=>a.length?a.reduce((t,x)=>t+x,0)/a.length:0;
function trophies(nid,st){
  const night=S.nights[nid]; if(!night)return null; const N=Math.max(1,night.courts||1);
  const ms=Object.values(S.scores).filter(s=>s.night===nid&&valid(s.sa,s.sb)), P={};
  for(const s of ms)for(const [me,op,a,b] of [[s.a,s.b,s.sa,s.sb],[s.b,s.a,s.sb,s.sa]])for(const x of me)(P[x]=P[x]||[]).push({id:s.id,mates:me.filter(y=>y!==x),opp:op,my:a,op:b,court:Number(s.court)});
  const el=Object.keys(P).filter(x=>S.players[x]&&P[x].length>=4); if(el.length<3)return null;
  const pre=x=>st[x]?.pre?.[nid]??1500, sc={};
  for(const x of el){const L=P[x];
    const up=[];for(const m of L)for(const mate of m.mates){const o=(P[mate]||[]).filter(q=>q.id!==m.id);if(o.length)up.push((m.my-m.op)-mean(o.map(q=>q.my-q.op)))}
    let close=0;const bon=L.map(m=>{const ta=mean([x,...m.mates].map(pre)),oa=mean(m.opp.map(pre));if(m.my<m.op&&oa>ta){if(m.op-m.my<=4)close++;return (1-(m.op-m.my)/21)*Math.min(1,(oa-ta)/100)}return 0});
    const w=L.filter(m=>m.my>m.op).length;
    sc[x]={ja:mean(up),lb:mean(L.map(m=>1-Math.abs(m.my-m.op)/21))+mean(bon),gain:st[x]?.perf?.[nid]||0,real:st[x]?.byNight?.[nid]||0,
      wt:mean(L.map(m=>((m.my>m.op?1:0)+(m.my-m.op)/21)*(1+0.5*(N-m.court)/Math.max(1,N-1)))),
      margin:mean(L.map(m=>Math.abs(m.my-m.op))),close,w,l:L.length-w}}
  const z=k=>{const v=el.map(x=>sc[x][k]),mu=mean(v),sd=Math.sqrt(mean(v.map(q=>(q-mu)**2)))||1;for(const x of el)sc[x]['z'+k]=(sc[x][k]-mu)/sd};
  z('gain');z('wt');for(const x of el)sc[x].mr=sc[x].zgain+sc[x].zwt;
  const taken=new Set(),win={};
  for(const k of ['mr','ja','lb']){const best=el.filter(x=>!taken.has(x)).sort((a,b)=>sc[b][k]-sc[a][k]||name(a).localeCompare(name(b),'fr'))[0];win[k]=best;taken.add(best)}
  const f1=v=>(v>0?'+':'')+v.toFixed(1).replace('.',',');
  return TROPH.map(t=>{const x=win[t.k],s=sc[x];
    const why=t.k==='ja'?`Ses partenaires ont fait en moyenne ${f1(s.ja)} points de mieux à ses côtés qu'avec leurs autres partenaires.`
      :t.k==='lb'?`Écart moyen de ${s.margin.toFixed(1).replace('.',',')} points dans ses matchs${s.close?`, ${s.close} défaite(s) serrée(s) contre plus fort`:''}.`
      :`${Math.round(s.real)>=0?'+':''}${Math.round(s.real)} de cote ce soir, fiche de ${s.w} victoire(s) et ${s.l} défaite(s).`;
    return {...t,who:x,why}});
}
function palmares(st){const c={};for(const n of Object.values(S.nights))if(n.status==='fini'){const t=trophies(n.id,st);if(t)for(const x of t){c[x.who]=c[x.who]||{ja:0,lb:0,mr:0};c[x.who][x.k]++}}return c}
const cup=col=>`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M18 8h28v14a14 14 0 0 1-28 0z" fill="${col}"/><path d="M18 12H8v4a10 10 0 0 0 10 10M46 12h10v4a10 10 0 0 1-10 10" fill="none" stroke="${col}" stroke-width="4"/><rect x="28" y="35" width="8" height="10" fill="${col}"/><rect x="20" y="45" width="24" height="6" rx="2" fill="${col}"/><rect x="16" y="51" width="32" height="7" rx="2" fill="${col}" opacity=".8"/><path d="M32 13l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.8z" fill="#fff" opacity=".85"/></svg>`;
// ---------- Badges, paliers, fiche, faits saillants, pronostics ----------
const TIERS=[[0,'Bronze','#c07a3e'],[1400,'Argent','#aab7c4'],[1500,'Or','#f2c230'],[1600,'Platine','#4fd1c5'],[1700,'Diamant','#7aa8ff']];
const tierOf=r=>{let i=0;for(let j=0;j<TIERS.length;j++)if(r>=TIERS[j][0])i=j;return i};
const tierTag=r=>{const t=TIERS[tierOf(r)];return `<span class="tier" style="--tc:${t[2]}">${t[1]}</span>`};
const BADGES=[
 {k:'premiere',n:'Première victoire',d:'Gagner un premier match',g:'1'},
 {k:'feu',n:'En feu',d:'4 victoires de suite',g:'4'},
 {k:'mur',n:'Le mur',d:'Gagner en accordant moins de 10 points',g:'M'},
 {k:'geant',n:'Tueur de géants',d:'Battre une équipe cotée 100 points de plus',g:'G'},
 {k:'ascenseur',n:'Ascenseur',d:'Finir 1er de son terrain aux deux rondes',g:'↑'},
 {k:'parfait',n:'Soirée parfaite',d:'Gagner tous ses matchs d\'une soirée',g:'6'},
 {k:'fidele',n:'Fidèle',d:'5 soirées de suite',g:'5'},
 {k:'etoile',n:'Étoile',d:'Remporter un trophée de soirée',g:'★'}];
function deep(sk='all'){
  deep.c=deep.v===S.ver&&deep.c?deep.c:{};deep.v=S.ver; if(deep.c[sk])return deep.c[sk];
  const {R,st,mi}=compute(), fins=Object.values(S.nights).filter(n=>n.status==='fini'&&inSaison(n.id,sk)).sort((a,b)=>a.id.localeCompare(b.id));
  const list=Object.values(S.scores).filter(s=>S.nights[s.night]&&valid(s.sa,s.sb)&&inSaison(s.night,sk)).sort((a,b)=>a.night.localeCompare(b.night)||a.round-b.round||a.court-b.court||a.m-b.m);
  const D={}; const d=x=>D[x]=D[x]||{b:{},streak:0,best:0,mates:{},opps:{},hist:[],pts:0,wins:0,l:0,pf:0,pa:0,nset:new Set()};
  const give=(x,k)=>{const o=d(x);o.b[k]=(o.b[k]||0)+1};
  for(const s of list){const m=mi[s.id];if(!m)continue;
    for(const [me,op,a,b,rm,ro] of [[s.a,s.b,s.sa,s.sb,m.ra,m.rb],[s.b,s.a,s.sb,s.sa,m.rb,m.ra]])for(const x of me){if(!S.players[x])continue;const o=d(x),won=a>b;o.pf+=a;o.pa+=b;o.nset.add(s.night);if(!won)o.l++;
      if(won){o.wins++;if(o.wins===1)give(x,'premiere');o.streak++;if(o.streak===4)give(x,'feu');if(b<10)give(x,'mur');if(ro-rm>=100)give(x,'geant')}else o.streak=0;
      for(const y of me)if(y!==x){const q=o.mates[y]=o.mates[y]||{w:0,n:0};q.n++;if(won)q.w++}
      for(const y of op){const q=o.opps[y]=o.opps[y]||{w:0,n:0};q.n++;if(!won)q.w++}}}
  const tro={},pal={};let run={};
  for(const n of fins){
    const played=new Set();for(const s of list)if(s.night===n.id)[...s.a,...s.b].forEach(x=>played.add(x));
    for(const x of Object.keys(S.players)){if(played.has(x)){run[x]=(run[x]||0)+1;if(run[x]===5)give(x,'fidele');const o=d(x),pre=st[x]?.pre?.[n.id];if(pre!=null){let w=0,l=0;for(const s of list)if(s.night===n.id){const ia=s.a.includes(x),ib=s.b.includes(x);if(ia||ib){((ia&&s.sa>s.sb)||(ib&&s.sb>s.sa))?w++:l++}}o.hist.push({n:n.id,pre,r:pre+(st[x].byNight[n.id]||0),w,l})}}else run[x]=0}
    const firsts={};for(const r of [1,2])for(const [c,ids] of Object.entries(n['r'+r]||{})){const sd=standings(n.id,r,c,ids,R);if(sd.length&&sd[0].w>0)firsts[sd[0].id]=(firsts[sd[0].id]||0)+1}
    for(const [x,k] of Object.entries(firsts))if(k>=2&&S.players[x])give(x,'ascenseur');
    for(const x of played){const L=list.filter(s=>s.night===n.id&&(s.a.includes(x)||s.b.includes(x)));if(L.length>=6&&S.players[x]&&L.every(s=>(s.a.includes(x)?s.sa>s.sb:s.sb>s.sa)))give(x,'parfait')}
    const t=trophies(n.id,st);if(t){tro[n.id]=t;for(const y of t){pal[y.who]=pal[y.who]||{ja:0,lb:0,mr:0};pal[y.who][y.k]++;give(y.who,'etoile')}
      for(const p of Object.values(S.pronos))if(p.night===n.id&&S.players[p.player]){const w=Object.fromEntries(t.map(y=>[y.k,y.who]));d(p.player).pts+=['ja','lb','mr'].filter(k=>p[k]&&p[k]===w[k]).length}}}
  for(const x in D){const h=D[x].hist;D[x].best=Math.max(Number(S.players[x]?.seed)||0,...h.map(q=>q.r))}
  return deep.c[sk]={R,st,mi,D,tro,pal,list,fins};
}
function faits(nid){const {mi,st,list}=deep(),L=list.filter(s=>s.night===nid);if(!L.length)return [];
  const out=[];const nm=ids=>ids.map(name).join(' et ');
  const up=L.map(s=>{const m=mi[s.id],wa=s.sa>s.sb;return {s,p:wa?m.ea:1-m.ea,w:wa?s.a:s.b,l:wa?s.b:s.a}}).sort((a,b)=>a.p-b.p)[0];
  if(up&&up.p<0.45)out.push(['Plus grosse surprise',`${nm(up.w)} battent ${nm(up.l)} (${Math.max(up.s.sa,up.s.sb)}-${Math.min(up.s.sa,up.s.sb)}), avec seulement ${Math.round(up.p*100)} % de chances au départ.`]);
  const cl=[...L].sort((a,b)=>Math.abs(a.sa-a.sb)-Math.abs(b.sa-b.sb))[0];
  out.push(['Match le plus serré',`${nm(cl.a)} contre ${nm(cl.b)} : ${cl.sa}-${cl.sb}, terrain ${cl.court}.`]);
  const g=Object.keys(S.players).map(x=>[x,st[x]?.byNight?.[nid]]).filter(q=>q[1]!=null).sort((a,b)=>b[1]-a[1])[0];
  if(g&&g[1]>0)out.push(['Plus beau bond',`${name(g[0])} gagne ${Math.round(g[1])} points de cote.`]);
  return out}
function messengerRecap(nid){const {tro}=deep(),t=tro[nid];let s=`Pickleball ${fmtDate(nid)} : les trophées!\n`;
  if(t)s+=t.map(x=>`${x.name} : ${name(x.who)}. ${x.why}`).join('\n');

async function shareBlob(blob,fname,title){
  const file=new File([blob],fname,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title});return}catch(e){if(e.name==='AbortError')return}}

// Statistiques avancées d'un joueur pour la saison choisie
function advStats(id,sk){
  const L=Object.values(S.scores).filter(x=>S.nights[x.night]&&valid(x.sa,x.sb)&&inSaison(x.night,sk)&&(x.a.includes(id)||x.b.includes(id)))
    .sort((a,b)=>a.night.localeCompare(b.night)||a.round-b.round||a.court-b.court||a.m-b.m);
  let cur=0,curW=null,best=0,run=0; const court={}, vs={}, wi={};
  for(const x of L){const ia=x.a.includes(id),me=ia?x.a:x.b,op=ia?x.b:x.a,won=ia?x.sa>x.sb:x.sb>x.sa;
    run=won?run+1:0;best=Math.max(best,run);
    if(curW===won)cur++;else{curW=won;cur=1}
    const c=court[x.court]=court[x.court]||{w:0,n:0};c.n++;if(won)c.w++;
    for(const y of op){const q=vs[y]=vs[y]||{w:0,n:0};q.n++;if(won)q.w++}
    for(const y of me)if(y!==id){const q=wi[y]=wi[y]||{w:0,n:0};q.n++;if(won)q.w++}}
  return {n:L.length,cur,curW,best,court,vs,wi};
}

// Échelle façon Fwango : l'ordre de départ (cotes de départ) puis, après chaque soirée terminée,
// le 1er de chaque terrain monte et le 4e descend (positions de la ronde 2). Les absents gardent leur place.
function ladder(){
  if(ladder.v===S.ver&&ladder.r)return ladder.r;
  const {R}=compute();
  let L=Object.keys(S.players).sort((a,b)=>(Number(S.players[b].seed)||0)-(Number(S.players[a].seed)||0)||S.players[a].name.localeCompare(S.players[b].name,'fr'));
  for(const n of Object.values(S.nights).filter(n=>n.status==='fini').sort((a,b)=>a.id.localeCompare(b.id))){
    const r=n.r2&&Object.keys(n.r2).length?2:1, cs=n['r'+r]||{}, keys=Object.keys(cs).map(Number).sort((a,b)=>a-b), N=keys.length; if(!N)continue;
    const rk=keys.map(c=>standings(n.id,r,c,cs[c],R).map(x=>x.id)), next=[];
    for(let i=0;i<N;i++){const cur=rk[i],L4=cur.length;
      const top=i===0?cur.slice(0,1):[rk[i-1][rk[i-1].length-1]], mid=cur.slice(1,L4-1), bot=i===N-1?cur.slice(L4-1):[rk[i+1][0]];
      next.push(...top,...mid,...bot)}
    const P=next.filter(x=>S.players[x]), set=new Set(P);
    for(const x of P)if(!L.includes(x))L.push(x);
    const slots=L.map((x,i)=>set.has(x)?i:-1).filter(i=>i>=0); slots.forEach((s,k)=>{L[s]=P[k]});
  }
  const pos=Object.fromEntries(L.map((x,i)=>[x,i+1]));
  return ladder.v=S.ver,ladder.r={L,pos};
}

}

}

const RULES_DEFAUT=`## Les soirées
La ligue joue le jeudi soir, en double, sur un maximum de 8 terrains. Les soirées sont créées automatiquement pendant la saison.

## Confirmer sa présence
Dans l'onglet Présences, choisis « Je serai là », « Disponible pour remplacer » ou « Je serai absent(e) ». Les places sont attribuées par groupes de 4, dans l'ordre des confirmations. Un remplaçant joue seulement quand un administrateur confirme sa place; il reçoit alors une notification.
Un rappel est envoyé le mardi soir et le jeudi midi à ceux qui n'ont pas répondu.

## Former les terrains
Avant le premier match, les joueurs présents sont placés selon leur cote : les 4 meilleures cotes au terrain 1, les 4 suivantes au terrain 2, et ainsi de suite.

## Une ronde
Chaque terrain réunit 4 joueurs qui jouent 3 matchs, en changeant de partenaire à chaque match. Le premier à 21 gagne, sans obligation d'écart de 2. N'importe quel joueur peut entrer le pointage.
Le classement du terrain se fait par victoires, puis par différentiel de points, puis par cote.

## Monter et descendre
Après la ronde 1, le 1er de chaque terrain monte d'un terrain et le 4e descend. La ronde 2 se joue avec ces nouveaux groupes.

## La cote
Chaque joueur a une cote Elo. Gagner contre plus fort rapporte plus, et un gros écart de points ajoute un bonus. La cote change une fois par soirée. Une absence ne change pas la cote.

## Trophées et badges
À la fin de chaque soirée, trois trophées sont remis à trois joueurs différents : le Maurice-Richard, le Jack Adams et le Lady Byng. Les badges et les paliers se trouvent dans Ma fiche.

## Une question, une idée?
Écris aux administrateurs avec le formulaire au bas de cette page.`;

async function exportExcel(){

      X.utils.book_append_sheet(wb,ws,nm)}
    const out=X.write(wb,{bookType:'xlsx',type:'array'}),blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),fname=`ligue-pickleball-${todayIso()}.xlsx`;

  if(a==='calCancel'){calEdit=null;render()}
  if(a==='calAddBloc'){calRead();calEdit.blocs.push({first:'',last:''});render()}
  if(a==='calDelBloc'){calRead();{const x=calEdit.blocs[Number(b.dataset.i)];if(x.first&&x.first<todayIso()&&!await ask('Retirer cette saison du calendrier? Ses soirées déjà jouées restent, mais leurs statistiques seront regroupées avec la saison précédente dans le Classement et Ma fiche.','Retirer'))return}calEdit.blocs.splice(Number(b.dataset.i),1);render()}
  if(a==='calDelFerme'){calRead();calEdit.fermes.splice(Number(b.dataset.i),1);render()}
  if(a==='calAddFerme'){calRead();const d=$('calFerme').value;if(!d){toast('Choisis une date');return}if(!isThu(d)){toast('Cette date n\'est pas un jeudi');return}
    if(!calEdit.fermes.includes(d))calEdit.fermes=[...calEdit.fermes,d].sort();render()}
  if(a==='calSave'){calRead();const bl=calEdit.blocs.filter(x=>x.first||x.last);
    if(!bl.length){toast('Il faut au moins une saison');return}
    if(bl.some(x=>!x.first||!x.last)){toast('Chaque saison doit avoir une première et une dernière soirée');return}
    if(bl.some(x=>x.first>x.last)){toast('Une saison finit avant de commencer : vérifie les dates');return}
    bl.sort((x,y)=>x.first.localeCompare(y.first));for(let k=1;k<bl.length;k++)if(bl[k].first<=bl[k-1].last){toast('Deux saisons se chevauchent : vérifie les dates');return}
    const closing=calEdit.fermes.filter(d=>!FERMES.includes(d)&&S.nights[d]);
    if(closing.length&&!await ask(`La soirée du ${closing.map(fmtDate).join(', ')} existe déjà. Si personne n'a encore joué, elle sera retirée avec les présences déjà reçues. Continuer?`))return;
    if(busy)return;busy=true;try{await rpc('admin_set_calendar',{p_code:code,p_blocs:bl,p_fermes:calEdit.fermes});calEdit=null;toast('Calendrier enregistré')}catch(x){toast(x.message)}finally{busy=false}await load()}
  if(a==='saveLeague'){await act('admin_set_league_code',{p_new:$('leagueSet').value},'Code de ligue changé')}
  if(a==='addP'){const nm=$('newName').value.trim(),sd=Number($('newSeed').value);if(!nm||!isFinite(sd)){toast('Nom et cote requis');return}await act('admin_upsert_player',{p_id:null,p_name:nm,p_seed:sd,p_adj:0,p_active:true},nm+' ajouté')}
  if(a==='bulk'){const lines=$('bulk').value.split('\n').map(s=>s.replace(/^\s*\d+[\.\)]\s*/,'').trim()).filter(Boolean);if(!lines.length)return;
    const rows=lines.map(l=>{const [nm,sd,fl]=l.split(';').map(x=>(x||'').trim());return {nm,sd:sd&&isFinite(Number(sd))?Number(sd):null,so:/^r/i.test(fl||''),fmt:l.includes(';')}}).filter(r=>r.nm);
    const plain=rows.filter(r=>r.sd==null);plain.forEach((r,i)=>r.sd=Math.round(plain.length>1?SEED_TOP-i*(SEED_TOP-SEED_BOT)/(plain.length-1):1500));
    if(!await ask(`Charger ${rows.length} joueurs${rows.some(r=>r.so)?` dont ${rows.filter(r=>r.so).length} remplaçant(s) seulement`:''}?`))return;
    const byName=Object.fromEntries(Object.entries(S.players).map(([id,p])=>[p.name.toLowerCase(),id]));
    busy=true;try{for(const r of rows){const ex=byName[r.nm.toLowerCase()],p=ex?S.players[ex]:null;
      const id=await rpc('admin_upsert_player',{p_code:code,p_id:ex||null,p_name:p?p.name:r.nm,p_seed:r.sd,p_adj:p?Number(p.adj)||0:0,p_active:p?p.active!==false:true});
      if(r.fmt)await rpc('admin_set_sub_only',{p_code:code,p_id:id||ex,p_flag:r.so})}
      toast('Joueurs chargés')}catch(err){toast(err.message)}finally{busy=false}await load()}
  if(a==='delP'&&await ask(`Retirer ${name(b.dataset.id)} de la ligue? Ses pointages passés seront ignorés dans les cotes.`))await act('admin_delete_player',{p_id:b.dataset.id},'Joueur retiré');
});
function route(){const h=location.hash.slice(1);view=['soiree','presences','classement','fiche','ligue','admin'].includes(h)?h:'soiree';render()}
addEventListener('hashchange',()=>{route();if(Date.now()-lastLoad>30000)load()});
// Rafraîchit toutes les 8 secondes, sauf pendant qu'on tape un pointage.
// Rafraîchissement automatique économe (un match dure de 10 à 15 minutes) :
// toutes les 2 min pendant une ronde en cours, toutes les 15 min autrement,
// et aussi à chaque retour dans l'application, changement d'onglet et action enregistrée.
let lastLoad=0;
setInterval(()=>{if(!code||busy||document.visibilityState!=='visible'||(document.activeElement&&document.activeElement.tagName==='INPUT'))return;
  const live=Object.values(S.nights).some(n=>n.status==='r1'||n.status==='r2');if(Date.now()-lastLoad>=(live?120000:900000))load()},10000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});
function setDeco(d){if(!['arene','terrain','epure'].includes(d))d='arene';document.body.dataset.deco=d;ls.set('pbdeco',d);for(const x of document.querySelectorAll('footer.deco button'))x.classList.toggle('on',x.dataset.d===d);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=d==='epure'?'#0b0b0f':d==='arene'?'#0a1430':'#1a4f8f'}
setDeco(ls.get('pbdeco')||'arene');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{});
code=ls.get('pbcode'); route(); load();
}
</script>
