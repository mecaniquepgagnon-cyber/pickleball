<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ligue pickleball du jeudi</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1d4f91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pickleball">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/*
VOICE: tableau de marque de club sportif, net et rapide sur un téléphone au bord du terrain
IDEA: la feuille de pointage affichée au mur du gymnase, un bloc par terrain
PICTURE: les cartes de terrain elles-mêmes, bleu court, lignes blanches, balle jaune optique
COLOUR and TYPE: bleu court #1d4f91 dominant, blanc, jaune balle #d6ee3a en accent, corail pour descendre; Barlow Condensed + Barlow
LAYOUT: bande bleue avec titre et onglets, puis une colonne de terrains; deux colonnes au-dessus de 900px
*/
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0c1522);--ink:light-dark(#0f1b2b,#e8eef6);--mute:light-dark(#5a6878,#9fb0c4);--line:light-dark(#dfe6ee,#22344b);--card:light-dark(#f4f7fb,#132235);--court:#1d4f91;--court2:#163e74;--ball:#d6ee3a;--down:#e4572e;--up:#2f9e5b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.num{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;line-height:1.05}
header{background:var(--court);color:#fff;padding:20px max(5vw,16px) 0}
header h1{margin:0;font-size:clamp(30px,6vw,44px);text-wrap:balance}
header p{margin:4px 0 14px;color:#c9d8ee}
nav{display:flex;gap:4px;overflow-x:auto}
nav a{flex:none;color:#dfe9f7;text-decoration:none;padding:10px 16px;border-radius:10px 10px 0 0;font-weight:600;min-height:44px}
nav a.on{background:var(--bg);color:var(--ink)}
main{padding:20px max(5vw,16px) 60px;max-width:1240px;margin:0 auto}
.note{color:var(--mute);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.pill.live{background:var(--ball);color:#1b2a05;border-color:transparent}
button,select,input{font:inherit;font-size:16px}
button{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer}
button.go{background:var(--court);color:#fff;border-color:var(--court)}
button.warn{color:var(--down)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,nav a:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
input,select{min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.courts{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.courts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.court{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.court>h3{margin:0;background:var(--court2);color:#fff;padding:10px 14px;font-size:24px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #fff}
.court>h3 span{font-size:15px;font-family:Barlow;font-weight:500;color:#c9d8ee}
.ppl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:10px}
.chip{display:flex;justify-content:space-between;gap:6px;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-weight:600;cursor:default}
.chip small{color:var(--mute);font-weight:500;white-space:nowrap}
.chip.sel{outline:3px solid var(--ball)}
.chip.up{border-left:5px solid var(--up)}.chip.down{border-left:5px solid var(--down)}
.swap .chip{cursor:pointer}
.match{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.teams{font-size:15px}.teams b{font-weight:600}.vs{color:var(--mute);padding:0 4px}
.sc{display:flex;gap:6px;align-items:center}
.sc input{width:58px;text-align:center}
.done{font-family:"Barlow Condensed";font-size:26px;white-space:nowrap}
.done .w{color:var(--up)}
.stand{padding:8px 14px 12px;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:14px;color:var(--mute);font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}
.big{font-family:"Barlow Condensed";font-size:22px}
.plus{color:var(--up)}.minus{color:var(--down)}
.panel{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;background:var(--card)}
.panel h2{margin:0 0 10px;font-size:26px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
textarea{width:100%;min-height:140px;font:16px/1.4 Barlow,sans-serif;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.list li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.list{list-style:none;margin:0;padding:0}
.hero{font-family:"Barlow Condensed";font-size:clamp(40px,10vw,64px);color:var(--court)}
:root[data-theme=dark] .hero{color:var(--ball)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .hero{color:var(--ball)}}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgb(0 0 0/.45)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
.mine{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--ball);color:#1b2a05;border-radius:16px;padding:14px 18px;margin:0 0 16px;font-family:"Barlow Condensed";font-size:clamp(26px,6vw,36px);font-weight:700}
.mine .num{font-size:1.3em}.mine small{font-family:Barlow;font-size:15px;font-weight:600}
.court.me{outline:4px solid var(--ball);outline-offset:-1px}
tr.meRow td{background:color-mix(in srgb,var(--ball) 25%,transparent)}
#logout{float:right;background:transparent;color:#dfe9f7;border-color:#4d77b3;min-height:36px;padding:4px 12px;font-size:14px}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal}.stack td:empty{display:none}.match{grid-template-columns:minmax(0,1fr)}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header>
  <button id="logout" hidden>Changer de code</button>
  <h1>Ligue de pickleball du jeudi</h1>
  <p id="sub">Chargement…</p>
  <nav id="nav">
    <a href="#soiree" data-v="soiree">Soirée</a>
    <a href="#presences" data-v="presences">Présences</a>
    <a href="#classement" data-v="classement">Classement</a>
    <a href="#admin" data-v="admin" id="navAdmin" hidden>Admin</a>
  </nav>
</header>
<main id="app"><p class="note">Chargement…</p></main>
<dialog id="dlg"><p id="dlgTxt"></p><div class="row"><button id="dlgNo">Annuler</button><button class="go" id="dlgYes">Confirmer</button></div></dialog>
<div class="toast" id="toast"></div>
<script>
{
// ====== À REMPLIR : Supabase > Project Settings > API ======
const SUPABASE_URL='https://vggxacxynhcoivnjianm.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable__B18jqGV1T3DIOVk_HVqzw_x7l0igGw';
const VAPID_PUBLIC='BCn_O8b4IIDGhoePWm5x6IMbdjBwN5kSnwRFwx_JWdUrPoKCd3dNoCWNQ6kgPPJVneW6otnCWyreZ4WTwQE0CAs';
// ===========================================================
const K=16, MAXC=8, SEED_TOP=1700, SEED_BOT=1300;
const S={players:{},nights:{},rsvp:{},scores:{},admin:false,league:'',push:[],ready:0};
let swReg=null, remindMsg='';
let code=null, view='soiree', curNight=null, curRound=null, swapMode=false, swapSel=null, busy=false;
const drafts={};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function ask(txt){return new Promise(res=>{const d=$('dlg');$('dlgTxt').textContent=txt;d.showModal();$('dlgYes').onclick=()=>{d.close();res(true)};$('dlgNo').onclick=()=>{d.close();res(false)}})}
const fmtDate=id=>{const [y,m,d]=id.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long'})};
function nextThursday(){const d=new Date();d.setDate(d.getDate()+((4-d.getDay()+7)%7));const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
const name=id=>S.players[id]?.name||'Joueur retiré';

// ---------- Supabase ----------
async function rpc(fn,args){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,...(SUPABASE_ANON_KEY.startsWith('eyJ')?{Authorization:'Bearer '+SUPABASE_ANON_KEY}:{})},body:JSON.stringify(args)});
  const t=await r.text(); let j=null; try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error(j?.message||'Erreur réseau');
  return j;
}
async function load(){
  if(!code)return;
  try{
    const st=await rpc('get_state',{p_code:code});
    S.admin=!!st.admin; S.league=st.league_code||''; S.push=st.push_players||[];
    S.players=Object.fromEntries(st.players.map(p=>[p.id,p]));
    S.nights=Object.fromEntries(st.nights.map(n=>[n.id,n]));
    S.rsvp=Object.fromEntries(st.rsvp.map(r=>[r.night+'__'+r.player,r]));
    S.scores=Object.fromEntries(st.scores.map(s=>[s.id,s]));
    S.ready=1; render();
  }catch(e){
    if(/Code invalide/.test(e.message)){code=null;ls.set('pbcode',null);S.ready=0;render();toast('Code de ligue invalide')}
    else if(!S.ready){$('app').innerHTML='<p class="note">Impossible de joindre la ligue pour l\'instant. Vérifie ta connexion.</p>'}
  }
}
async function act(fn,args,ok){if(busy)return;busy=true;try{await rpc(fn,{p_code:code,...args});if(ok)toast(ok);await load()}catch(e){toast(e.message)}finally{busy=false}}

// ---------- Cote Elo ----------
function compute(){
  const R={},st={};
  for(const [id,p] of Object.entries(S.players)){R[id]=Number(p.seed)||1500;st[id]={w:0,l:0,pf:0,pa:0,nights:new Set(),last:0,lastNight:null}}
  const list=Object.values(S.scores).filter(s=>S.nights[s.night]&&valid(s.sa,s.sb)).sort((a,b)=>a.night.localeCompare(b.night)||a.round-b.round||a.court-b.court||a.m-b.m);
  for(const s of list){
    const A=s.a.filter(x=>R[x]!=null),B=s.b.filter(x=>R[x]!=null); if(!A.length||!B.length)continue;
    const ra=A.reduce((t,x)=>t+R[x],0)/A.length, rb=B.reduce((t,x)=>t+R[x],0)/B.length;
    const ea=1/(1+10**((rb-ra)/400)), sa=s.sa>s.sb?1:0, mg=Math.abs(s.sa-s.sb);
    const M=0.6+0.4*Math.log(mg+1)/Math.log(11), d=K*M*(sa-ea);
    const apply=(ids,dd,pf,pa,win)=>ids.forEach(x=>{R[x]+=dd;const t=st[x];t.pf+=pf;t.pa+=pa;win?t.w++:t.l++;t.nights.add(s.night);if(t.lastNight!==s.night){t.lastNight=s.night;t.last=0}t.last+=dd});
    apply(A,d,s.sa,s.sb,sa===1);apply(B,-d,s.sb,s.sa,sa===0);
  }
  for(const id in R)R[id]+=Number(S.players[id].adj)||0;
  return {R,st};
}
const valid=(a,b)=>Number.isInteger(a)&&Number.isInteger(b)&&Math.max(a,b)===21&&Math.min(a,b)>=0&&Math.min(a,b)<21;

// ---------- Soirées ----------
const nightsSorted=()=>Object.values(S.nights).sort((a,b)=>b.id.localeCompare(a.id));
const pairs=p=>[[[p[0],p[3]],[p[1],p[2]]],[[p[0],p[2]],[p[1],p[3]]],[[p[0],p[1]],[p[2],p[3]]]];
const skey=(n,r,c,m)=>`${n}__r${r}__c${c}__m${m}`;
function standings(n,r,c,ids,R){
  const t=Object.fromEntries(ids.map(x=>[x,{id:x,w:0,d:0}]));
  for(let m=1;m<=3;m++){const s=S.scores[skey(n,r,c,m)];if(!s||!valid(s.sa,s.sb))continue;
    s.a.forEach(x=>{if(t[x]){t[x].d+=s.sa-s.sb;if(s.sa>s.sb)t[x].w++}});s.b.forEach(x=>{if(t[x]){t[x].d+=s.sb-s.sa;if(s.sb>s.sa)t[x].w++}})}
  return Object.values(t).sort((a,b)=>b.w-a.w||b.d-a.d||(R[b.id]||0)-(R[a.id]||0));
}
function roundDone(n,r){const cs=n['r'+r]||{};return Object.keys(cs).length>0&&Object.keys(cs).every(c=>[1,2,3].every(m=>{const s=S.scores[skey(n.id,r,c,m)];return s&&valid(s.sa,s.sb)}))}
function answers(nid,st){return Object.values(S.rsvp).filter(x=>x.night===nid&&S.players[x.player]&&S.players[x.player].active!==false&&(!st||(x.status||'present')===st)).sort((a,b)=>a.ts-b.ts)}
const confirmed=nid=>answers(nid,'present');
// Seuls les présents jouent (ordre de confirmation). Un remplaçant joue seulement si un administrateur confirme sa place.
function lineup(nid){const P=answers(nid,'present'),Rm=answers(nid,'remplacant'),order=P.map(x=>x.player),play=Math.min(MAXC*4,Math.floor(order.length/4)*4),miss=order.length<MAXC*4&&order.length%4?4-order.length%4:0;return {P,Rm,order,play,miss,inn:new Set(order.slice(0,play))}}
const PRES=[['present','Je serai là'],['remplacant','Disponible pour remplacer'],['absent','Je serai absent(e)']];
const presLabel=s=>({present:'Présent',remplacant:'Remplaçant',absent:'Absent'}[s]||'Sans réponse');
const saveNight=(n,ok)=>act('admin_save_night',{p_night:n},ok);

async function generate(n){
  const {R}=compute(), L=lineup(n.id), play=L.play;
  if(play<4){toast('Il faut au moins 4 joueurs confirmés');return}
  const inn=L.order.slice(0,play).sort((a,b)=>R[b]-R[a]), wait=L.order.slice(play), r1={};
  for(let c=1;c<=play/4;c++)r1[c]=inn.slice((c-1)*4,c*4);
  curRound=1; await saveNight({...n,status:'r1',r1,r2:{},wait,courts:play/4},'Terrains générés');
}
async function toRound2(n){
  const {R}=compute(), N=n.courts, rk={}, nx={};
  for(let c=1;c<=N;c++){rk[c]=standings(n.id,1,c,n.r1[c],R).map(x=>x.id);nx[c]=[]}
  for(let c=1;c<=N;c++){const r=rk[c];nx[c].push(...r.slice(1,r.length-1));nx[c>1?c-1:1].push(r[0]);nx[c<N?c+1:N].push(r[r.length-1])}
  for(let c=1;c<=N;c++)nx[c].sort((a,b)=>R[b]-R[a]);
  curRound=2; await act('advance',{p_night:n.id,p_status:'r2',p_r2:nx},'Ronde 2 prête');
}
async function saveScore(n,r,c,m,a,b){
  const k=skey(n.id,r,c,m), sa=parseInt($('sa-'+k).value,10), sb=parseInt($('sb-'+k).value,10);
  if(!valid(sa,sb)){toast('Pointage invalide: une équipe a 21, l\'autre moins de 21');return}
  delete drafts[k];
  await act('save_score',{p_night:n.id,p_round:r,p_court:Number(c),p_m:m,p_a:a,p_b:b,p_sa:sa,p_sb:sb},'Pointage enregistré');
}
async function doSwap(n,r,x,y){
  const g=JSON.parse(JSON.stringify(n)), get=p=>p[0]==='w'?[g.wait,p[1]]:[g['r'+r][p[0]],p[1]];
  const [la,ia]=get(x),[lb,ib]=get(y);[la[ia],lb[ib]]=[lb[ib],la[ia]];
  await saveNight(g,'Joueurs échangés');
}
function myCourt(n,r){const me=ls.get('pbme');if(!me)return null;const cs=n['r'+r]||{};for(const c in cs)if(cs[c].includes(me))return c;if((n.wait||[]).includes(me))return 'w';return null}

// ---------- Rappels (notifications) ----------
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const pushOK='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
function b64u(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function enablePush(){
  const me=ls.get('pbme'); if(!me){toast('Choisis d\'abord ton nom dans « Je suis »');return}
  try{
    const perm=await Notification.requestPermission(); if(perm!=='granted'){toast('Notifications refusées. Tu peux les permettre dans les réglages du téléphone.');return}
    const reg=swReg||await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    await rpc('save_push',{p_code:code,p_player:me,p_sub:sub.toJSON()}); ls.set('pbpush',me); toast('Rappels activés sur ce téléphone'); render();
  }catch(e){toast('Impossible d\'activer les rappels: '+e.message)}
}
async function disablePush(){
  try{const reg=swReg||await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    if(sub){await rpc('delete_push',{p_code:code,p_endpoint:sub.endpoint});await sub.unsubscribe()}
    ls.set('pbpush',null);toast('Rappels désactivés');render()}catch(e){toast(e.message)}
}
async function callReminders(type,player){
  try{const r=await fetch(`${SUPABASE_URL}/functions/v1/rappels`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,type,player})});
    const j=await r.json(); if(j.error)throw new Error(j.error); if(type!=='remplacant')toast(`${j.sent} notification(s) envoyée(s)`); return j.sent}catch(e){toast('Envoi impossible: '+e.message);return 0}
}
function remindPanel(){
  const me=ls.get('pbme'), on=ls.get('pbpush')&&ls.get('pbpush')===me&&typeof Notification!=='undefined'&&Notification.permission==='granted';
  let t='<div class="panel"><h2>Rappels sur ton téléphone</h2>';
  if(on)return t+`<p>Les rappels sont activés. Tu recevras une notification le mardi soir, puis le jeudi midi si tu n'as pas encore répondu.</p><button data-act="pushOff">Désactiver les rappels</button></div>`;
  if(isIOS&&!standalone)return t+`<p>Sur iPhone, installe d'abord l'application : ouvre ce site dans <b>Safari</b>, touche le bouton <b>Partager</b> puis <b>Sur l'écran d'accueil</b>. Ouvre ensuite l'application à partir de l'icône et reviens ici.</p></div>`;
  if(!pushOK)return t+`<p class="note">Ce navigateur ne permet pas les notifications. Essaie avec Chrome sur Android ou Safari sur iPhone.</p></div>`;
  return t+`<p>Reçois un rappel pour confirmer ta présence chaque semaine.</p><button class="go" data-act="pushOn"${me?'':' disabled'}>Activer les rappels</button>${me?'':'<p class="note">Choisis d\'abord ton nom dans « Je suis ».</p>'}</div>`;
}
function buildRemind(){
  const n=nightsSorted().find(x=>x.status==='inscription'); if(!n){toast('Crée d\'abord la soirée');return ''}
  const L=lineup(n.id), miss=Object.entries(S.players).filter(([id,p])=>p.active!==false&&!S.rsvp[n.id+'__'+id]).map(([,p])=>p.name).sort((a,b)=>a.localeCompare(b,'fr'));

    await act('set_presence',{p_night:ni.id,p_player:b.dataset.p,p_status:s||null},s?presLabel(s)+' : réponse enregistrée':'Réponse effacée')}
  if(a==='newNight'){const d=$('newDate').value;if(!d)return;if(S.nights[d]){toast('Cette soirée existe déjà');return}curNight=d;await saveNight({id:d,status:'inscription',r1:{},r2:{},wait:[],courts:0},'Soirée créée')}
  if(a==='delNight'&&await ask('Supprimer cette soirée et ses pointages? Les cotes seront recalculées.')){curNight=null;await act('admin_delete_night',{p_id:b.dataset.n},'Soirée supprimée')}
  if(a==='saveLeague'){await act('admin_set_league_code',{p_new:$('leagueSet').value},'Code de ligue changé')}
  if(a==='addP'){const nm=$('newName').value.trim(),sd=Number($('newSeed').value);if(!nm||!isFinite(sd)){toast('Nom et cote requis');return}await act('admin_upsert_player',{p_id:null,p_name:nm,p_seed:sd,p_adj:0,p_active:true},nm+' ajouté')}
  if(a==='bulk'){const names=$('bulk').value.split('\n').map(s=>s.replace(/^\s*\d+[\.\)]?\s*/,'').trim()).filter(Boolean);if(!names.length)return;
    if(!await ask(`Charger ${names.length} joueurs avec des cotes de ${SEED_TOP} à ${SEED_BOT}?`))return;
    const byName=Object.fromEntries(Object.entries(S.players).map(([id,p])=>[p.name.toLowerCase(),id]));
    busy=true;try{for(let i=0;i<names.length;i++){const sd=Math.round(names.length>1?SEED_TOP-i*(SEED_TOP-SEED_BOT)/(names.length-1):1500),ex=byName[names[i].toLowerCase()],p=ex?S.players[ex]:null;
      await rpc('admin_upsert_player',{p_code:code,p_id:ex||null,p_name:p?p.name:names[i],p_seed:sd,p_adj:p?Number(p.adj)||0:0,p_active:p?p.active!==false:true})}
      toast('Classement chargé')}catch(err){toast(err.message)}finally{busy=false}await load()}
  if(a==='delP'&&await ask(`Retirer ${name(b.dataset.id)} de la ligue? Ses pointages passés seront ignorés dans les cotes.`))await act('admin_delete_player',{p_id:b.dataset.id},'Joueur retiré');
});
function route(){const h=location.hash.slice(1);view=['soiree','presences','classement','admin'].includes(h)?h:'soiree';render()}
addEventListener('hashchange',route);
// Rafraîchit toutes les 8 secondes, sauf pendant qu'on tape un pointage.
setInterval(()=>{if(code&&!busy&&document.visibilityState==='visible'&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))load()},8000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{});
code=ls.get('pbcode'); route(); load();
}
</script>
